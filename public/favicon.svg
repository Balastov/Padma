<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="padmaG" x1="8" y1="20" x2="92" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2EEAF5"/>
      <stop offset="38%" stop-color="#5B7CFF"/>
      <stop offset="72%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E048FF"/>
    </linearGradient>
    <filter id="padmaSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.45" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer teardrop stroke curling into clockwise spiral -->
  <path
    d="M50 12
       C68 24 82 42 84 60
       C86 78 74 92 56 94
       C42 95 30 86 28 72
       C26 58 38 48 52 50
       C64 52 70 64 64 74
       C60 80 52 82 46 78
       C42 75 42 68 48 66
       C52 64 56 67 56 71"
    stroke="url(#padmaG)"
    stroke-width="13.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#padmaSoft)"
  />

  <!-- Soft highlight on the left-top arc -->
  <path
    d="M46 18 C58 26 70 40 74 52"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
    opacity="0.38"
  />
</svg>
